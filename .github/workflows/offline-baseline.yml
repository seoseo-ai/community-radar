name: Offline baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile tracked Python and check Bash syntax without execution
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          count = 0
          for name in filter(None, names):
              path = Path(name)
              if path.suffix == '.py':
                  compile(path.read_bytes(), name, 'exec')
                  count += 1
              elif path.suffix == '.sh':
                  subprocess.run(['bash', '-n', name], check=True)
                  count += 1
          assert count, 'No supported source files found'
          print(f'Checked syntax for {count} tracked source files')
          PYTHON
